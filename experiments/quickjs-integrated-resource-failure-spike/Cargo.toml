[package]
name = "universal-source-quickjs-integrated-resource-failure-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "loader"] }
admission = { package = "universal-source-quickjs-regexp-admission-impl-spike", path = "../quickjs-regexp-admission-impl-spike" }
